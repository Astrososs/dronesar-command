version: '3.8'

services:
  sar-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_MAPBOX_ACCESS_TOKEN=${VITE_MAPBOX_ACCESS_TOKEN}
        - VITE_VSS_API_URL=${VITE_VSS_API_URL}
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
